<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Note</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="logo">P</span><strong>PDF Note</strong><span id="filename"></span></div>
      <div class="actions">
        <button id="open">PDFを開く</button><button id="projectOpen">編集データを開く</button
        ><button id="projectSave" disabled>編集データを保存</button><button id="save" class="primary" disabled>PDFを保存</button>
      </div>
    </header>
    <nav aria-label="編集ツール">
      <div class="tools">
        <button data-tool="select" class="active">選択・移動</button><button data-tool="text">文字</button
        ><button data-tool="line">直線</button><button data-tool="pen">手書き</button><button data-tool="highlight">マーカー</button
        ><button data-tool="rect">四角</button><button data-tool="ellipse">楕円</button><button data-tool="arrow">矢印</button
        ><button id="photo">写真を追加</button><button id="undo" disabled title="Ctrl+Z">↶ 戻す</button
        ><button id="redo" disabled title="Ctrl+Y">↷ やり直す</button>
      </div>
      <div class="paging">
        <label class="viewChoice"
          >表示<select id="viewMode" aria-label="表示形式" disabled>
            <option value="single">1ページずつ</option>
            <option value="continuous">縦に連続表示</option>
          </select></label
        ><button id="prev" aria-label="前のページ">‹</button><span id="pageNumber">0 / 0</span
        ><button id="next" aria-label="次のページ">›</button><button id="zoomOut" aria-label="縮小">−</button
        ><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="拡大">＋</button><button id="fit">幅に合わせる</button>
      </div>
    </nav>
    <main>
      <aside id="sidebar">
        <section id="pageSidebar">
          <div class="rail-header"><strong>ページ</strong><button id="railAppend" disabled>PDFを追加</button></div>
          <div class="rail-actions">
            <button id="railRotate" disabled>↻ 右に回転</button><button id="railBlank" disabled>白紙を挿入</button>
          </div>
          <div id="pageThumbs" role="listbox" aria-label="PDFのページ一覧"></div>
        </section>
        <section id="settingsPanel">
          <label>色<input type="color" id="color" value="#000000" /></label
          ><label class="check" id="fillRow" hidden>塗りつぶし<input type="checkbox" id="fill" /></label
          ><label>文字サイズ <span>pt</span><input id="fontSize" type="number" min="6" max="180" value="18" /></label
          ><label>線の太さ <span>pt</span><input id="lineWidth" type="number" min="0.5" max="50" step="0.5" value="2" /></label>
          <section id="selection">
            <p id="selectionInfo" hidden></p>
            <div id="sizeControls" hidden>
              <label>幅 <span>pt</span><input id="objectWidth" type="number" min="1" step="1" /></label
              ><label>高さ <span>pt</span><input id="objectHeight" type="number" min="1" step="1" /></label>
            </div>
            <button id="editText" disabled>文字を編集</button><button id="delete" disabled>選択した書き込みを削除</button>
          </section>
          <p class="tip" id="toolHint"></p>
        </section>
      </aside>
      <div id="workspace">
        <div id="empty">
          <div class="emptyIcon">PDF</div>
          <h1>PDFに、書き込もう。</h1>
          <button id="start" class="primary">PDFを選ぶ</button>
        </div>
        <div id="pageStack" hidden>
          <div id="pageWrap" hidden>
            <canvas id="pdfCanvas"></canvas
            ><svg id="overlay" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="PDF書き込み領域"></svg>
            <div id="formLayer" aria-label="PDF内の文字入力欄"></div>
          </div>
        </div>
      </div>
    </main>
    <footer><span id="status" role="status"></span></footer>
    <dialog id="textDialog">
      <form method="dialog">
        <h2>文字を入力</h2>
        <textarea id="textValue" rows="5" aria-label="追加する文字"></textarea>
        <div><button value="cancel">キャンセル</button><button id="textConfirm" value="ok" class="primary">配置する</button></div>
      </form>
    </dialog>
    <input id="appendInput" type="file" accept="application/pdf,.pdf" multiple hidden /><input
      id="fileInput"
      type="file"
      accept="application/pdf,.pdf"
      hidden
    /><input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden /><input
      id="projectInput"
      type="file"
      accept=".pdfnote,application/json"
      hidden
    />
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="vendor/fontkit.umd.min.js"></script>
    <script type="module" src="editor.js"></script>
  </body>
</html>
