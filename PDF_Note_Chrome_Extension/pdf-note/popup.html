<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>PDF Note</title>
  </head>
  <body>
    <h1>PDF Note</h1>
    <p>いつもはChrome。書き込むときだけ、ここから編集。</p>
    <button id="current">このPDFを編集</button><button id="open" class="secondary">パソコン内のPDFを選ぶ</button>
    <p id="message" role="status">文字・線・写真を追加してPDFに保存できます。</p>
    <input id="localPdf" type="file" accept="application/pdf,.pdf" hidden /><small
      >PDFは外部へ送信しません。既定ビューアーも変更しません。</small
    >
    <script type="module" src="popup.js"></script>
  </body>
</html>
